openapi: 3.1.0
info:
  title: EZ VPN Lego Control API
  version: 0.1.0-draft
  description: Local control-plane contract used by official adapters.
servers:
  - url: http://localhost/v1
    description: HTTP transported over the local Unix socket
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Control-plane health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Users visible to the authenticated administrator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "202":
          description: User creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
  /operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperation
      responses:
        "200":
          description: Current operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
    CreateUser:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          const: queued
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, rolling_back, rolled_back]
        error_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

