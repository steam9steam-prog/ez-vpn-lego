openapi: 3.1.0
info:
  title: EZ VPN Lego Control API
  version: 0.2.0-preview
  description: Local control-plane contract used by official adapters.
servers:
  - url: http://localhost/v1
    description: HTTP transported over the local Unix socket
paths:
  /profiles:
    get:
      operationId: listProfiles
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/AdminID"
      responses:
        "200":
          description: Available profiles. No reachability guarantee for a country or operator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "401":
          description: Valid adapter token and administrator identity required
  /topology/plan:
    post:
      operationId: planTopology
      description: Validates an installation and builds a plan. Does not save state or apply changes.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/AdminID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Installation"
      responses:
        "200":
          description: Read-only installation plan, without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyPlan"
        "400":
          description: Invalid topology, unknown profile, missing domain, port conflict or unavailable backend
        "401":
          description: Valid adapter token and administrator identity required
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Control-plane health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /bootstrap/owner:
    post:
      operationId: bootstrapOwner
      description: Creates the only owner when no administrator exists.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Owner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "409":
          description: An administrator already exists
  /bootstrap/vpn:
    post:
      operationId: bootstrapVPN
      description: Creates the initial REALITY/Vision instance and owner access.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/AdminID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapVPN"
      responses:
        "201":
          description: VPN instance created and validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessResult"
        "409":
          description: VPN instance already exists
  /access:
    post:
      operationId: createAccess
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/AdminID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Access created and active Xray configuration reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessResult"
  /auth/telegram/pairing:
    post:
      operationId: createTelegramPairing
      description: Creates a single-use pairing token valid for 15 minutes.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/AdminID"
      responses:
        "201":
          description: Pairing token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingToken"
  /auth/telegram/claim:
    post:
      operationId: claimTelegramPairing
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, subject]
              properties:
                token: {type: string}
                subject: {type: string}
      responses:
        "200":
          description: Telegram identity bound to administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
  /auth/telegram/resolve:
    get:
      operationId: resolveTelegramIdentity
      security: [{bearerAuth: []}]
      parameters:
        - name: subject
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Active administrator identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
  /users:
    get:
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminID"
      responses:
        "200":
          description: Users visible to the authenticated administrator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreation"
        "200":
          description: Idempotent replay of an existing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreation"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AdminID:
      name: X-Admin-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Installation:
      type: object
      additionalProperties: false
      required: [schema_version, nodes, routes]
      properties:
        schema_version: {type: integer, const: 1}
        nodes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/TopologyNode"}
        routes:
          type: array
          items: {$ref: "#/components/schemas/TopologyRoute"}
    TopologyNode:
      type: object
      additionalProperties: false
      required: [id, name, address, roles, owner]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,79}$'}
        name: {type: string, minLength: 1, maxLength: 80}
        address: {type: string, description: Public IP address or lowercase DNS name, without a port}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [control, entry, exit]}
        owner: {type: string, enum: [lego, remnawave, marzban]}
        country: {type: string, description: Optional display metadata, not a routing restriction}
        relay_port: {type: integer, minimum: 0, maximum: 65535, default: 10443, description: Zero or omitted uses port 10443}
        reality_target: {type: string, description: Optional host and port, paired with reality_server_name}
        reality_server_name: {type: string}
    TopologyRoute:
      type: object
      additionalProperties: false
      required: [id, name, entry_id, profile, port]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,79}$'}
        name: {type: string, minLength: 1, maxLength: 80}
        entry_id: {type: string}
        exit_id: {type: string, description: Omit for a direct route. Must differ from entry_id.}
        profile: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        domain: {type: string, description: Required for a profile using ordinary TLS}
    TopologyPlan:
      type: object
      additionalProperties: false
      required: [schema_version, control_node_id, nodes, domains, warnings]
      properties:
        schema_version: {type: integer, const: 1}
        control_node_id: {type: string}
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [node, routes, relay]
            properties:
              node: {$ref: "#/components/schemas/TopologyNode"}
              routes:
                type: array
                items: {$ref: "#/components/schemas/TopologyRoute"}
              relay: {type: boolean}
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, node_id, address, purpose]
            properties:
              name: {type: string}
              node_id: {type: string}
              address: {type: string}
              purpose: {type: string, const: vpn-tls}
        warnings:
          type: array
          items: {type: string}
    Profile:
      type: object
      additionalProperties: false
      required: [id, name, engine, transport, security, needs_domain, clients, status, evidence, sources]
      properties:
        id: {type: string}
        name: {type: string}
        engine: {type: string}
        transport: {type: string}
        security: {type: string}
        needs_domain: {type: boolean}
        clients:
          type: array
          items: {type: string}
        status: {type: string, enum: [implemented, experimental, deprecated]}
        evidence: {type: string}
        sources:
          type: array
          items: {type: string, format: uri}
    Admin:
      type: object
      additionalProperties: false
      required: [id, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, operator, viewer]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateUser:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    UserCreation:
      type: object
      additionalProperties: false
      required: [operation_id, user, replayed]
      properties:
        operation_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        replayed:
          type: boolean
    BootstrapVPN:
      type: object
      additionalProperties: false
      required: [public_address, port, target, server_name]
      properties:
        public_address: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        target: {type: string}
        server_name: {type: string}
    AccessResult:
      type: object
      additionalProperties: false
      required: [operation_id, user_id, device_id, uri]
      properties:
        operation_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        uri: {type: string}
    PairingToken:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token: {type: string}
        expires_at: {type: string, format: date-time}
