name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.arch }}
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_B64"
          printf '%s' "$RELEASE_SIGNING_KEY_B64" | base64 --decode > signing-key.pem
          chmod 0600 signing-key.pem
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          openssl pkeyutl -sign -inkey signing-key.pem -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f signing-key.pem
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "EZ VPN Lego ${GITHUB_REF_NAME}"
